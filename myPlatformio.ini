[env:arduino_nano_esp32_dual]
platform = espressif32
board = arduino_nano_esp32
framework = arduino	

; Board-specific settings (ESP32-S3 with 16MB Flash, 8MB PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

lib_deps = 
;    https://github.com/greiman/SdFat.git
;    https://github.com/pschatzmann/arduino-audio-tools.git
;    https://github.com/pschatzmann/arduino-audio-driver.git
;    https://github.com/pschatzmann/arduino-libhelix.git
;	Adafruit/Adafruit NeoPixel @ ^1.10.6


; Build flags for PSRAM and partition support
build_flags =
    -std=c++17 
    -D CORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
;	-DSD_CHIP_SELECT_MODE=1
    -DBOARD_HAS_PSRAM
	-DDCCEX_NODE
    -DDCCEX_NODE_NANO_DUAL
    -DNO_DISPLAY
	-DI2C_SDA=11
	-DI2C_SCL=10
    -mfix-esp32-psram-cache-issue
    -DESP_IDF_VERSION_MAJOR=5

; Specify upload and monitor speed
upload_speed = 921600
upload_protocol = esptool
monitor_speed = 115200
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0
;monitor_filters = esp32_exception_decoder, default


